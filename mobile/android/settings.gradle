rootProject.name = 'AIposter'
apply from: file("../node_modules/@react-native/gradle-plugin/settings-plugin.gradle")

include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')

if (new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), "../android").exists()) {
    includeBuild(new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), "../android"))
}
if (new File(["node", "--print", "require.resolve('@react-native/gradle-plugin/package.json')"].execute(null, rootDir).text.trim(), "..").exists()) {
    includeBuild(new File(["node", "--print", "require.resolve('@react-native/gradle-plugin/package.json')"].execute(null, rootDir).text.trim(), ".."))
}
